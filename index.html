<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Visualizations</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --bg-elevated: rgba(255, 255, 255, 0.72);
      --bg-glass: rgba(255, 255, 255, 0.55);
      --stroke: rgba(0, 0, 0, 0.08);
      --stroke-strong: rgba(0, 0, 0, 0.12);
      --text: #1c1c1e;
      --text-secondary: #636366;
      --text-tertiary: #8e8e93;
      --accent: #007aff;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --radius: 20px;
      --blur: 40px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-elevated: rgba(28, 28, 30, 0.72);
        --bg-glass: rgba(44, 44, 46, 0.55);
        --stroke: rgba(255, 255, 255, 0.1);
        --stroke-strong: rgba(255, 255, 255, 0.16);
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --text-tertiary: #636366;
        --accent: #0a84ff;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.2);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.47;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0, 122, 255, 0.08), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(175, 82, 222, 0.06), transparent 45%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(52, 199, 89, 0.05), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 48px 24px 80px; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.15; }
    header p { margin-top: 8px; font-size: 17px; color: var(--text-secondary); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 28px; }
    .filter-btn {
      appearance: none; border: 1px solid var(--stroke);
      background: var(--bg-glass);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      color: var(--text-secondary); padding: 7px 14px; border-radius: 980px;
      font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--stroke-strong); }
    .filter-btn.active { background: var(--accent); border-color: transparent; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      background: var(--bg-elevated);
      backdrop-filter: blur(var(--blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid var(--stroke); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); overflow: hidden;
      transition: transform 0.25s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.25s, border-color 0.2s;
    }
    .card:hover { transform: scale(1.015) translateY(-2px); box-shadow: var(--shadow); border-color: var(--stroke-strong); }
    .card-preview {
      height: 120px; display: flex; align-items: center; justify-content: center; font-size: 40px;
      background: linear-gradient(180deg, rgba(0,0,0,0.02), transparent);
      border-bottom: 1px solid var(--stroke);
    }
    @media (prefers-color-scheme: dark) {
      .card-preview { background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent); }
    }
    .card-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; }
    .card-body h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
    .card-body p { font-size: 13px; color: var(--text-secondary); line-height: 1.4; flex: 1; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .tag {
      font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px;
      background: rgba(0, 122, 255, 0.1); color: var(--accent);
    }
    @media (prefers-color-scheme: dark) { .tag { background: rgba(10, 132, 255, 0.18); } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Math Visualizations</h1>
      <p>Interactive simulations · chaos · fractals · physics</p>
    </header>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="chaos">Chaos</button>
      <button class="filter-btn" data-filter="cellular">Cellular</button>
      <button class="filter-btn" data-filter="fractal">Fractal</button>
      <button class="filter-btn" data-filter="physics">Physics</button>
      <button class="filter-btn" data-filter="math">Math</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const items = [
      { title: "Langton's Ant", desc: "Simple rules, complex trails", emoji: "🐜", tags: ["cellular", "chaos"], path: "visualizations/langtons-ant/" },
      { title: "Triple Pendulum", desc: "Chaotic multi-body motion", emoji: "🔗", tags: ["physics", "chaos"], path: "visualizations/triple-pendulum/" },
      { title: "Double Pendulum", desc: "Classic sensitive dependence", emoji: "⏱️", tags: ["physics", "chaos"], path: "visualizations/double-pendulum/" },
      { title: "Lorenz Attractor", desc: "The butterfly effect", emoji: "🦋", tags: ["chaos", "math"], path: "visualizations/lorenz/" },
      { title: "Game of Life", desc: "Conway's cellular automaton", emoji: "🟩", tags: ["cellular"], path: "visualizations/game-of-life/" },
      { title: "Mandelbrot Set", desc: "The classic complex fractal", emoji: "🌀", tags: ["fractal", "math"], path: "visualizations/mandelbrot/" },
      { title: "Julia Set", desc: "Sibling of the Mandelbrot", emoji: "💠", tags: ["fractal", "math"], path: "visualizations/julia/" },
      { title: "Sierpinski", desc: "Recursive triangle fractal", emoji: "△", tags: ["fractal"], path: "visualizations/sierpinski/" },
      { title: "Barnsley Fern", desc: "IFS plant fractal", emoji: "🌿", tags: ["fractal"], path: "visualizations/barnsley-fern/" },
      { title: "Logistic Map", desc: "Route to chaos via bifurcation", emoji: "📈", tags: ["chaos", "math"], path: "visualizations/logistic-map/" },
      { title: "Fourier Series", desc: "Waves from rotating circles", emoji: "🌊", tags: ["math"], path: "visualizations/fourier/" },
      { title: "Lissajous", desc: "Harmonic curve compositions", emoji: "∞", tags: ["math", "physics"], path: "visualizations/lissajous/" },
      { title: "Boids", desc: "Reynolds flocking model", emoji: "🐦", tags: ["physics"], path: "visualizations/boids/" },
      { title: "Particle Life", desc: "Emergent particle interactions", emoji: "✨", tags: ["chaos", "physics"], path: "visualizations/particle-life/" },
      { title: "Cloth", desc: "Verlet soft-body simulation", emoji: "🧵", tags: ["physics"], path: "visualizations/verlet-cloth/" },
    ];
    const grid = document.getElementById("grid");
    function render(filter = "all") {
      grid.innerHTML = "";
      const list = filter === "all" ? items : items.filter(i => i.tags.includes(filter));
      list.forEach(item => {
        const a = document.createElement("a");
        a.href = item.path;
        a.className = "card";
        a.innerHTML = `
          <div class="card-preview">${item.emoji}</div>
          <div class="card-body">
            <h2>${item.title}</h2>
            <p>${item.desc}</p>
            <div class="tags">${item.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
          </div>`;
        grid.appendChild(a);
      });
    }
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        render(btn.dataset.filter);
      });
    });
    render();
  </script>
</body>
</html>
