<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>バーンズリーのシダ</title>
  <style>
    :root { --bg:#0b0f14; --card:#141a22; --border:#1e2733; --text:#e6edf5; --muted:#8b9bb4; --accent:#5b9dff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { padding:1rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; }
    header a { color:var(--accent); text-decoration:none; font-size:0.9rem; }
    h1 { font-size:1.15rem; font-weight:600; }
    .controls { display:flex; gap:0.5rem; }
    button { background:var(--card); border:1px solid var(--border); color:var(--text); padding:0.4rem 0.8rem; border-radius:8px; cursor:pointer; font-size:0.85rem; }
    button:hover { border-color:var(--accent); }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:1rem; }
    canvas { background:#05070a; border-radius:12px; border:1px solid var(--border); max-width:100%; }
  </style>
</head>
<body>
  <header>
    <div><a href="../../">← コレクション</a><h1>バーンズリーのシダ (IFS)</h1></div>
    <div class="controls"><button id="more">点を増やす</button></div>
  </header>
  <main><canvas id="c" width="600" height="700"></canvas></main>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let x=0, y=0, count=0;
    function next() {
      const r = Math.random();
      let nx, ny;
      if (r < 0.01) { nx = 0; ny = 0.16*y; }
      else if (r < 0.86) { nx = 0.85*x + 0.04*y; ny = -0.04*x + 0.85*y + 1.6; }
      else if (r < 0.93) { nx = 0.2*x - 0.26*y; ny = 0.23*x + 0.22*y + 1.6; }
      else { nx = -0.15*x + 0.28*y; ny = 0.26*x + 0.24*y + 0.44; }
      x=nx; y=ny;
    }
    function add(n) {
      ctx.fillStyle = "#3dd68c";
      for (let i=0;i<n;i++) {
        next();
        const px = 300 + x * 55;
        const py = 680 - y * 55;
        ctx.fillRect(px, py, 1, 1);
        count++;
      }
    }
    ctx.fillStyle="#05070a"; ctx.fillRect(0,0,600,700);
    add(40000);
    document.getElementById("more").onclick = ()=> add(30000);
  </script>
</body>
</html>
