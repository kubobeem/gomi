<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Boids</title>
<style>
:root {
  --bg: #f2f2f7; --glass: rgba(255,255,255,0.72); --stroke: rgba(0,0,0,0.08);
  --text: #1c1c1e; --text2: #636366; --accent: #007aff; --blur: 40px; --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --glass: rgba(28,28,30,0.75); --stroke: rgba(255,255,255,0.12);
    --text: #f5f5f7; --text2: #98989d; --accent: #0a84ff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(0,122,255,0.07), transparent 50%),
    radial-gradient(ellipse 50% 30% at 90% 5%, rgba(175,82,222,0.05), transparent 45%);
}
header {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 12px 20px; background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border-bottom: 1px solid var(--stroke);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.info { color: var(--text2); font-size: 12px; }
main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
canvas {
  background: #0a0a0c; border-radius: var(--radius); border: 1px solid var(--stroke);
  max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.12); cursor: crosshair; touch-action: none;
}
</style>
</head>
<body>
<header>
  <div class="brand"><a href="../../">Back</a><h1>Boids</h1></div>
  <div class="controls"><span class="info">Hold mouse to attract · Right-click repel</span></div>
</header>
<main><canvas id="c" width="900" height="550"></canvas></main>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const N = 90;
const boids = Array.from({ length: N }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  vx: (Math.random() - 0.5) * 4,
  vy: (Math.random() - 0.5) * 4
}));
let mouse = null, repel = false;

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width * canvas.width,
    y: (e.clientY - r.top) / r.height * canvas.height
  };
}

canvas.addEventListener("pointerdown", e => {
  mouse = pointerPos(e);
  repel = e.button === 2;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (mouse) mouse = pointerPos(e);
});
canvas.addEventListener("pointerup", () => { mouse = null; });
canvas.addEventListener("pointercancel", () => { mouse = null; });
canvas.oncontextmenu = e => e.preventDefault();

function update() {
  for (const b of boids) {
    let sx = 0, sy = 0, cx = 0, cy = 0, ax = 0, ay = 0, n = 0;
    for (const o of boids) {
      if (o === b) continue;
      const dx = o.x - b.x, dy = o.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 < 2500 && d2 > 0) {
        n++;
        cx += o.x; cy += o.y;
        ax += o.vx; ay += o.vy;
        if (d2 < 400) { sx -= dx / d2 * 20; sy -= dy / d2 * 20; }
      }
    }
    if (n > 0) {
      cx = cx / n - b.x; cy = cy / n - b.y;
      ax = ax / n - b.vx; ay = ay / n - b.vy;
      b.vx += sx * 0.08 + cx * 0.003 + ax * 0.04;
      b.vy += sy * 0.08 + cy * 0.003 + ay * 0.04;
    }
    if (mouse) {
      const dx = mouse.x - b.x, dy = mouse.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      const f = (repel ? -1 : 1) * 0.35 * Math.min(1, 200 / d);
      b.vx += f * dx / d;
      b.vy += f * dy / d;
    }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 5) { b.vx *= 5 / sp; b.vy *= 5 / sp; }
    if (sp < 1.5) { b.vx *= 1.5 / sp; b.vy *= 1.5 / sp; }
    b.x = (b.x + b.vx + canvas.width) % canvas.width;
    b.y = (b.y + b.vy + canvas.height) % canvas.height;
  }
}

function draw() {
  ctx.fillStyle = "rgba(10,10,12,0.3)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (mouse) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 18, 0, Math.PI * 2);
    ctx.strokeStyle = repel ? "rgba(255,59,48,0.5)" : "rgba(10,132,255,0.5)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  for (const b of boids) {
    const ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(-5, 4);
    ctx.lineTo(-5, -4);
    ctx.closePath();
    ctx.fillStyle = "#0a84ff";
    ctx.fill();
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
