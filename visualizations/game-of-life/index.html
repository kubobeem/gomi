<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Game of Life</title>
<style>
:root {
  --bg: #f2f2f7; --glass: rgba(255,255,255,0.72); --stroke: rgba(0,0,0,0.08);
  --text: #1c1c1e; --text2: #636366; --accent: #007aff; --blur: 40px; --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --glass: rgba(28,28,30,0.75); --stroke: rgba(255,255,255,0.12);
    --text: #f5f5f7; --text2: #98989d; --accent: #0a84ff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(0,122,255,0.07), transparent 50%),
    radial-gradient(ellipse 50% 30% at 90% 5%, rgba(175,82,222,0.05), transparent 45%);
}
header {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 12px 20px; background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border-bottom: 1px solid var(--stroke);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button {
  appearance: none; border: 1px solid var(--stroke); background: var(--glass);
  color: var(--text); padding: 6px 12px; border-radius: 980px;
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
}
button:hover { border-color: var(--accent); }
button.active { background: var(--accent); border-color: transparent; color: #fff; }
label { color: var(--text2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
input[type=range] { width: 80px; accent-color: var(--accent); }
.info { color: var(--text2); font-size: 12px; font-variant-numeric: tabular-nums; }
main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
canvas {
  background: #0a0a0c; border-radius: var(--radius); border: 1px solid var(--stroke);
  max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}
</style>
</head>
<body>
<header>
  <div class="brand"><a href="../../">Back</a><h1>Game of Life</h1></div>
  <div class="controls"><button id="play" class="active">Pause</button><button id="reset">Clear</button><button id="random">Random</button><button id="glider">Glider</button><span class="info" id="gen">0</span></div>
</header>
<main><canvas id="c" width="800" height="500" style="cursor:crosshair;image-rendering:pixelated"></canvas></main>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const CELL=5,COLS=Math.floor(canvas.width/CELL),ROWS=Math.floor(canvas.height/CELL);
let grid=new Uint8Array(COLS*ROWS),next=new Uint8Array(COLS*ROWS),running=true,gen=0;
function idx(x,y){return ((y+ROWS)%ROWS)*COLS+((x+COLS)%COLS);}
function step(){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=grid[idx(x+dx,y+dy)];
  const i=y*COLS+x;next[i]=grid[i]?(n===2||n===3?1:0):(n===3?1:0);}[grid,next]=[next,grid];gen++;document.getElementById("gen").textContent=gen;}
function draw(){ctx.fillStyle="#0a0a0c";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#30d158";
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y*COLS+x])ctx.fillRect(x*CELL,y*CELL,CELL-1,CELL-1);}
function randomize(){for(let i=0;i<grid.length;i++)grid[i]=Math.random()<0.28?1:0;gen=0;}
canvas.onmousedown=e=>{const r=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*COLS);const y=Math.floor((e.clientY-r.top)/r.height*ROWS);grid[idx(x,y)]^=1;draw();};
let last=0;function loop(t){if(running&&t-last>80){step();draw();last=t;}else if(!running)draw();requestAnimationFrame(loop);}
document.getElementById("play").onclick=function(){running=!running;this.textContent=running?"Pause":"Play";this.classList.toggle("active",running);};
document.getElementById("reset").onclick=()=>{grid.fill(0);gen=0;draw();};
document.getElementById("random").onclick=()=>{randomize();draw();};
document.getElementById("glider").onclick=()=>{[[0,1],[1,2],[2,0],[2,1],[2,2]].forEach(([x,y])=>{grid[idx(10+x,10+y)]=1;});draw();};
randomize();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
