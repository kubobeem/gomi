<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Julia Set</title>
<style>
:root {
  --bg: #f2f2f7; --glass: rgba(255,255,255,0.72); --stroke: rgba(0,0,0,0.08);
  --text: #1c1c1e; --text2: #636366; --accent: #007aff; --blur: 40px; --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --glass: rgba(28,28,30,0.75); --stroke: rgba(255,255,255,0.12);
    --text: #f5f5f7; --text2: #98989d; --accent: #0a84ff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(0,122,255,0.07), transparent 50%),
    radial-gradient(ellipse 50% 30% at 90% 5%, rgba(175,82,222,0.05), transparent 45%);
}
header {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 12px 20px; background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border-bottom: 1px solid var(--stroke);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button {
  appearance: none; border: 1px solid var(--stroke); background: var(--glass);
  color: var(--text); padding: 6px 12px; border-radius: 980px;
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
}
button:hover { border-color: var(--accent); }
button.active { background: var(--accent); border-color: transparent; color: #fff; }
.info { color: var(--text2); font-size: 12px; }
main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
canvas {
  background: #0a0a0c; border-radius: var(--radius); border: 1px solid var(--stroke);
  max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.12); cursor: crosshair; touch-action: none;
}
</style>
</head>
<body>
<header>
  <div class="brand"><a href="../../">Back</a><h1>Julia Set</h1></div>
  <div class="controls">
    <button id="modeParam" class="active">Move = c</button>
    <button id="modePan">Pan / Zoom</button>
    <button id="reset">Reset</button>
    <span class="info" id="param"></span>
  </div>
</header>
<main><canvas id="c" width="900" height="650"></canvas></main>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let cx = -0.4, cy = 0.6;
let xmin = -1.8, xmax = 1.8, ymin = -1.35, ymax = 1.35;
let mode = "param";
let MAX = 100;
let dragging = false, lastX = 0, lastY = 0;
let renderQueued = false;

function maxIter() {
  const scale = Math.min(xmax - xmin, ymax - ymin);
  return Math.min(350, Math.max(60, Math.floor(50 + 18 * Math.log10(3 / scale))));
}

function render() {
  renderQueued = false;
  MAX = maxIter();
  document.getElementById("param").textContent =
    `c = ${cx.toFixed(4)} + ${cy.toFixed(4)}i · zoom ×${(3 / Math.min(xmax - xmin, ymax - ymin)).toExponential(1)}`;
  const w = canvas.width, h = canvas.height;
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let py = 0; py < h; py++) {
    const y0 = ymin + (ymax - ymin) * py / h;
    for (let px = 0; px < w; px++) {
      let x = xmin + (xmax - xmin) * px / w, y = y0, i = 0;
      while (x * x + y * y <= 4 && i < MAX) {
        const xt = x * x - y * y + cx;
        y = 2 * x * y + cy;
        x = xt;
        i++;
      }
      const t = i / MAX, idx = (py * w + px) * 4;
      if (i >= MAX) { d[idx] = d[idx + 1] = d[idx + 2] = 8; }
      else {
        d[idx] = 20 + t * 160;
        d[idx + 1] = 50 + Math.sin(t * 6) * 70;
        d[idx + 2] = 130 + t * 120;
      }
      d[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function queueRender() {
  if (!renderQueued) {
    renderQueued = true;
    requestAnimationFrame(render);
  }
}

function screenToComplex(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: xmin + (xmax - xmin) * (clientX - r.left) / r.width,
    y: ymin + (ymax - ymin) * (clientY - r.top) / r.height
  };
}

document.getElementById("modeParam").onclick = function () {
  mode = "param";
  this.classList.add("active");
  document.getElementById("modePan").classList.remove("active");
  canvas.style.cursor = "crosshair";
};
document.getElementById("modePan").onclick = function () {
  mode = "pan";
  this.classList.add("active");
  document.getElementById("modeParam").classList.remove("active");
  canvas.style.cursor = "grab";
};
document.getElementById("reset").onclick = () => {
  cx = -0.4; cy = 0.6;
  xmin = -1.8; xmax = 1.8; ymin = -1.35; ymax = 1.35;
  render();
};

canvas.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  if (mode === "param") {
    const r = canvas.getBoundingClientRect();
    cx = -1.5 + 3 * (e.clientX - r.left) / r.width;
    cy = -1.5 + 3 * (e.clientY - r.top) / r.height;
    queueRender();
  }
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  if (mode === "param") {
    const r = canvas.getBoundingClientRect();
    cx = -1.5 + 3 * (e.clientX - r.left) / r.width;
    cy = -1.5 + 3 * (e.clientY - r.top) / r.height;
    queueRender();
  } else {
    const r = canvas.getBoundingClientRect();
    const dx = (e.clientX - lastX) / r.width * (xmax - xmin);
    const dy = (e.clientY - lastY) / r.height * (ymax - ymin);
    xmin -= dx; xmax -= dx;
    ymin -= dy; ymax -= dy;
    lastX = e.clientX;
    lastY = e.clientY;
    queueRender();
  }
});

canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("pointercancel", () => { dragging = false; });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const p = screenToComplex(e.clientX, e.clientY);
  const factor = e.deltaY > 0 ? 1.35 : 1 / 1.35;
  xmin = p.x - (p.x - xmin) * factor;
  xmax = p.x + (xmax - p.x) * factor;
  ymin = p.y - (p.y - ymin) * factor;
  ymax = p.y + (ymax - p.y) * factor;
  queueRender();
}, { passive: false });

render();
</script>
</body>
</html>
