<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Langton's Ant</title>
<style>
:root {
  --bg: #f2f2f7; --glass: rgba(255,255,255,0.72); --stroke: rgba(0,0,0,0.08);
  --text: #1c1c1e; --text2: #636366; --accent: #007aff; --blur: 40px; --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --glass: rgba(28,28,30,0.75); --stroke: rgba(255,255,255,0.12);
    --text: #f5f5f7; --text2: #98989d; --accent: #0a84ff;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 70% 40% at 15% 0%, rgba(0,122,255,0.07), transparent 50%),
    radial-gradient(ellipse 50% 30% at 90% 5%, rgba(175,82,222,0.05), transparent 45%);
}
header {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 12px 20px; background: var(--glass);
  backdrop-filter: blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
  border-bottom: 1px solid var(--stroke);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button {
  appearance: none; border: 1px solid var(--stroke); background: var(--glass);
  color: var(--text); padding: 6px 12px; border-radius: 980px;
  font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
}
button:hover { border-color: var(--accent); }
button.active { background: var(--accent); border-color: transparent; color: #fff; }
label { color: var(--text2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
input[type=range] { width: 80px; accent-color: var(--accent); }
.info { color: var(--text2); font-size: 12px; font-variant-numeric: tabular-nums; }
main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
canvas {
  background: #0a0a0c; border-radius: var(--radius); border: 1px solid var(--stroke);
  max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}
</style>
</head>
<body>
<header>
  <div class="brand"><a href="../../">Back</a><h1>Langton's Ant</h1></div>
  <div class="controls">
    <button id="play" class="active">Pause</button>
    <button id="reset">Reset</button>
    <button id="step">Step</button>
    <label>Speed <input type="range" id="speed" min="1" max="200" value="30"></label>
    <span class="info" id="steps">0</span>
  </div>
</header>
<main><canvas id="c" width="800" height="600"></canvas></main>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const CELL = 4;
const COLS = Math.floor(canvas.width / CELL);
const ROWS = Math.floor(canvas.height / CELL);
let grid = new Uint8Array(COLS * ROWS);
let antX = Math.floor(COLS / 2), antY = Math.floor(ROWS / 2), dir = 0, steps = 0;
let running = true, speed = 30, last = 0;
const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
function reset() {
  grid.fill(0); antX = Math.floor(COLS/2); antY = Math.floor(ROWS/2); dir = 0; steps = 0;
  document.getElementById("steps").textContent = "0"; draw();
}
function step() {
  const i = antY * COLS + antX;
  const state = grid[i];
  dir = state === 0 ? (dir + 1) % 4 : (dir + 3) % 4;
  grid[i] = state ^ 1;
  antX = (antX + dirs[dir][0] + COLS) % COLS;
  antY = (antY + dirs[dir][1] + ROWS) % ROWS;
  steps++;
}
function draw() {
  const img = ctx.createImageData(canvas.width, canvas.height);
  const d = img.data;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const v = grid[y * COLS + x] ? 18 : 248;
    for (let dy = 0; dy < CELL; dy++) for (let dx = 0; dx < CELL; dx++) {
      const px = ((y * CELL + dy) * canvas.width + (x * CELL + dx)) * 4;
      d[px] = d[px+1] = d[px+2] = v; d[px+3] = 255;
    }
  }
  const ax = antX * CELL, ay = antY * CELL;
  for (let dy = 0; dy < CELL; dy++) for (let dx = 0; dx < CELL; dx++) {
    const px = ((ay + dy) * canvas.width + (ax + dx)) * 4;
    d[px] = 255; d[px+1] = 59; d[px+2] = 48; d[px+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById("steps").textContent = steps.toLocaleString();
}
function loop(t) {
  if (running) {
    const n = Math.max(1, Math.floor(speed / 5));
    for (let i = 0; i < n; i++) step();
    if (t - last > 16) { draw(); last = t; }
  }
  requestAnimationFrame(loop);
}
document.getElementById("play").onclick = function() {
  running = !running; this.textContent = running ? "Pause" : "Play"; this.classList.toggle("active", running);
};
document.getElementById("reset").onclick = reset;
document.getElementById("step").onclick = () => { step(); draw(); };
document.getElementById("speed").oninput = e => { speed = +e.target.value; };
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
